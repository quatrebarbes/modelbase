# Environnement de développement/test du plug-in uniquement (pas de prod, cf. docs/roadmap.md).

services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    working_dir: /var/www/demo
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      PGSQL_HOST: pgsql
    entrypoint: ["/bin/sh", "/var/www/docker/app-entrypoint.sh"]
    depends_on:
      mysql:
        condition: service_healthy
      pgsql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    working_dir: /var/www/frontend
    volumes:
      - .:/var/www
      # Node modules du conteneur isolés du bind-mount du repo : évite
      # d'écraser/réutiliser un node_modules installé côté hôte (autre OS/arch).
      - frontend_node_modules:/var/www/frontend/node_modules
    ports:
      - "3000:3000"
    environment:
      # Cible du proxy Nitro (cf. frontend/nuxt.config.ts) : "app", le nom du
      # service Laravel dans le réseau docker-compose, plutôt que le
      # "localhost:8000" par défaut (valable seulement hors conteneur).
      MODELBASE_API_ORIGIN: http://app:8000
    entrypoint: ["/bin/sh", "/var/www/docker/frontend-entrypoint.sh"]
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgsql:
    image: postgres:16
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "54321:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  pgsql_data:
  frontend_node_modules:
