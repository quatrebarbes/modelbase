# Environnement de développement/test du plug-in uniquement (pas de prod, cf. docs/roadmap.md).

services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    working_dir: /var/www/demo
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      PGSQL_HOST: pgsql
    entrypoint: ["/bin/sh", "/var/www/docker/app-entrypoint.sh"]
    depends_on:
      mysql:
        condition: service_healthy
      pgsql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgsql:
    image: postgres:16
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "54321:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  pgsql_data:
